version: "3.3"

services:
  app1:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app1
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - MONGO_URI=${MONGO_URI}
      - APP_PORT=${APP_PORT}
      - APP_HOST=${APP_HOST}
    depends_on:
      - redis
      - mongo
    restart: ${APP_RESTART_POLICY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "${APP_EXTERNAL_PORT1}:${APP_PORT}"
    networks:
      - app_network

  app2:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app2
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MONGO_URI=${MONGO_URI}
      - APP_PORT=${APP_PORT}
      - APP_HOST=${APP_HOST}
    depends_on:
      - redis
      - mongo
    restart: ${APP_RESTART_POLICY}
    healthcheck:
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START_PERIOD}
    ports:
      - "${APP_EXTERNAL_PORT2}:${APP_PORT}"
    networks:
      - app_network

  redis:
    image: ${REDIS_IMAGE}  # Pull Redis from Docker Hub
    env_file:
      - .env
    ports:
      - "${REDIS_EXTERNAL_PORT}:${REDIS_PORT}"
    volumes:
      - "${REDIS_DATA_VOLUME}:/data"
    restart: ${REDIS_RESTART_POLICY}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START_PERIOD}
    networks:
      - app_network

  mongo:
    image: ${MONGO_IMAGE}  # Pull MongoDB from Docker Hub
    env_file:
      - .env
    ports:
      - "${MONGO_EXTERNAL_PORT}:27017"
    volumes:
      - "${MONGO_DATA_VOLUME}:/data/db"
    restart: ${MONGO_RESTART_POLICY}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: ${HEALTHCHECK_START_PERIOD}
    networks:
      - app_network

volumes:
  app_redis_data:
    driver: local
  app_mongo_data:
    driver: local 

networks:
  app_network:
    name: ${NETWORK_NAME}
    driver: bridge
